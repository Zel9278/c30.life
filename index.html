      .intro-text { margin: 0 0 1rem; color: #d1d5db; text-align: center; }

      .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: 0.75rem; }

      .info-label, .info-sub { color: #9ca3af; font-size: 0.75rem; }
      .info-value { margin: 0.2rem 0; color: #fff; font-weight: 600; }

      .link-item { border: 1px solid var(--ns-line); border-radius: 0.5rem; }
      .link-item a { display: block; padding: 0.8rem 1rem; color: var(--ns-link); font-weight: 500; text-decoration: none; }
      .link-item a:hover, .link-item a:focus-visible { text-decoration: underline; }

      .banner-container { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; justify-content: center; }
      .banner-item { flex: 0 1 auto; }
      .banner-item img {
        display: block;
        width: min(100%, 320px);
        height: auto;
        min-height: 64px;
        box-sizing: border-box;
        object-fit: contain;
        border: 1px solid var(--ns-line);
        border-radius: 0.5rem;
        background: #fff;
      }

      @media (max-width: 30rem) {
        .noscript-container { padding-inline: 0.75rem; }
        .link-list { grid-template-columns: 1fr; }
